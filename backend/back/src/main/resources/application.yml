server:
  port: 8080
  servlet:
    context-path: /api          # 所有接口加 /api 前缀，便于 Nginx 反代

spring:
  profiles:
    active: dev                  # 默认 dev 环境，生产用 -Dspring.profiles.active=prod 覆盖
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.workorder.back.entity
  configuration:
    map-underscore-to-camel-case: true      # t_article -> tArticle 自动驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期打印 SQL
  global-config:
    db-config:
      id-type: auto              # 主键自增
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh-CN

# JWT 配置（P3 用，先占位）
jwt:
  header: Authorization
  prefix: "Bearer "
  expire: 28800                   # 8 小时（秒）
