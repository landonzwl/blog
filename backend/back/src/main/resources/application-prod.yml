spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/blog?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD}
    database: 0

jwt:
  secret: ${JWT_SECRET}           # 生产密钥从环境变量注入，不要写死

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl   # 生产关 SQL 日志

logging:
  level:
    com.workorder.back: info
