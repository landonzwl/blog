# 生产编排：MySQL + Redis + API + 前端 Nginx
# 用法：docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  mysql:
    image: mysql:5.7
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --lower_case_table_names=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/init:/docker-entrypoint-initdb.d:ro
    # 不暴露公网，仅容器网络访问
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: blog-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 128m

  api:
    build:
      context: ./backend/back
      dockerfile: Dockerfile
    container_name: blog-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xms128m -Xmx384m"
    mem_limit: 512m

  web:
    build:
      context: ./frontend/front
      dockerfile: Dockerfile
    container_name: blog-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    mem_limit: 64m

volumes:
  mysql_data:
  redis_data:
