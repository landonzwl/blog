# 生产编排：MySQL + Redis + 博客 API + 企业管理系统 + RAG 工单 + 前端 Nginx
# 用法：docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  mysql:
    image: mysql:5.7
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --lower_case_table_names=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/init:/docker-entrypoint-initdb.d:ro
    # 不暴露公网，仅容器网络访问
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: blog-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 128m

  api:
    build:
      context: ./backend/back
      dockerfile: Dockerfile
    container_name: blog-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xms128m -Xmx384m"
    mem_limit: 512m

  np-db:
    image: mysql:5.7
    container_name: blog-np-db
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      NP_APP_USER: ${MYSQL_USER}
      BLOG_DATABASE: ${MYSQL_DATABASE:-blog}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        mysql -hmysql -uroot --default-character-set=utf8mb4 --connect-timeout=20 -e "CREATE DATABASE IF NOT EXISTS np DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS rag_ticket DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON np.* TO '$$NP_APP_USER'@'%'; GRANT ALL PRIVILEGES ON rag_ticket.* TO '$$NP_APP_USER'@'%'; FLUSH PRIVILEGES;"
        mysql -hmysql -uroot --default-character-set=utf8mb4 "$$BLOG_DATABASE" -e "UPDATE t_project SET app_key='np', title='企业管理系统', summary='覆盖销售、采购、库存、生产、财务、人事与排班。单据和审批存在 MySQL，排班由 CP-SAT 求解，打开作品即可试用。', date_label='2024.09 ~ 2026.10', update_time=NOW() WHERE deleted=0 AND (app_key='np' OR title='智能排班系统'); UPDATE t_project SET app_key='rag', content='定制展示页由前端 showcase「rag」承载。', update_time=NOW() WHERE deleted=0 AND (app_key='rag' OR title='RAG 智能工单系统');"

  np:
    build:
      context: ./NP/server
      dockerfile: Dockerfile
    container_name: blog-np
    restart: unless-stopped
    depends_on:
      np-db:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NP_DB_URL: jdbc:mysql://mysql:3306/np?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&useUnicode=true
      NP_DB_USER: ${MYSQL_USER}
      NP_DB_PASSWORD: ${MYSQL_PASSWORD}
      JAVA_OPTS: "-Xms64m -Xmx256m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  rag:
    build:
      context: ./RAG/RAG
      dockerfile: Dockerfile
    container_name: blog-rag
    restart: unless-stopped
    depends_on:
      np-db:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: rag_ticket
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rag_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v3}
      JAVA_OPTS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC"
      TZ: Asia/Shanghai
    mem_limit: 448m
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: frontend/front/Dockerfile
    container_name: blog-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      np:
        condition: service_healthy
      rag:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 64m

volumes:
  mysql_data:
  redis_data:
