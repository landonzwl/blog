<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · RAG 智能工单系统</title>
<style>
:root {
  --bg:#f4f6fa; --panel:#fff; --border:#e4e8f0; --primary:#2563eb; --text:#1e293b; --text2:#64748b;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height: 100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); }
.layout { display:flex; min-height:100%; }
.topbar {
  position:fixed; top:0; left:0; right:0; height:56px; background:var(--panel);
  border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px;
  gap:20px; z-index:10;
}
.topbar b { font-size:15px; }
.topbar .tabs { display:flex; gap:4px; margin-left:24px; }
.tab {
  padding:8px 16px; border-radius:9px; cursor:pointer; font-size:14px; color:var(--text2);
  border:none; background:none;
}
.tab.active { background:#eff6ff; color:var(--primary); font-weight:600; }
.topbar .spacer { flex:1; }
.topbar a, .topbar button.plain { font-size:13px; color:var(--text2); text-decoration:none; background:none; border:none; cursor:pointer; }
.identity select { padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; color:var(--text); background:#fff; cursor:pointer; }
.content { margin-top:56px; padding:24px; flex:1; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; }
h3.section { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
h3.section small { color:var(--text2); font-weight:400; font-size:12px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:var(--text2); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
tr:hover td { background:#fafbfd; }
.badge { font-size:11px; padding:2px 10px; border-radius:20px; color:#fff; white-space:nowrap; }
.btn { padding:7px 16px; border-radius:8px; border:none; font-size:13px; cursor:pointer; background:var(--primary); color:#fff; }
.btn:hover { opacity:.9; }
.btn.ghost { background:var(--bg); color:var(--text2); border:1px solid var(--border); }
select.mini, input.mini { padding:6px 8px; border:1px solid var(--border); border-radius:7px; font-size:12px; }
.log-toggle { font-size:12px; color:var(--primary); cursor:pointer; background:none; border:none; }
.log-panel { background:#f8fafc; border-radius:8px; padding:10px 12px; font-size:12px; color:var(--text2); line-height:1.9; }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; }
.field input, .field textarea {
  width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:inherit;
}
.field textarea { min-height:140px; resize:vertical; }
.two-col { display:grid; grid-template-columns: 2fr 1fr; gap:20px; align-items:start; }
.modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.55); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal { width:360px; background:#fff; border-radius:18px; padding:28px; }
.error-text { color:#dc2626; font-size:12px; min-height:16px; margin-top:8px; }
.status-filter { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.hidden { display:none !important; }
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff;
  padding:10px 20px; border-radius:10px; font-size:13px; opacity:0; transition:.3s; z-index:200; pointer-events:none;
}
.toast.show { opacity:1; }
</style>
</head>
<body>
<div class="topbar">
  <b>🛠 RAG 智能工单系统 · 管理后台</b>
  <div class="tabs">
    <button class="tab active" data-tab="tickets">工单处理</button>
    <button class="tab" data-tab="knowledge">知识库</button>
  </div>
  <div class="spacer"></div>
  <label class="identity">身份
    <select id="identitySelect">
      <option value="U1001">李雷 · 用户</option>
      <option value="U1002">韩梅梅 · 用户</option>
      <option value="A0001">张文龙 · 管理员</option>
      <option value="A0002">王工 · 管理员</option>
    </select>
  </label>
  <a href="index.html">← 返回聊天助手</a>
</div>

<div class="content">
  <!-- 工单处理 -->
  <div class="card" id="tab-tickets">
    <h3 class="section">🎫 工单列表 <small>状态变更会实时推送到对应用户的聊天窗口</small></h3>
    <div class="status-filter" id="statusFilter">
      <button class="btn ghost" data-s="">全部</button>
      <button class="btn ghost" data-s="OPEN">待受理</button>
      <button class="btn ghost" data-s="PROCESSING">处理中</button>
      <button class="btn ghost" data-s="RESOLVED">已解决</button>
      <button class="btn ghost" data-s="CLOSED">已关闭</button>
    </div>
    <table>
      <thead><tr>
        <th>工单号</th><th>用户</th><th>类别</th><th>标题 / 描述</th><th>紧急度</th>
        <th>当前状态</th><th>处理人</th><th style="width:300px">操作（状态 / 备注 → 保存）</th>
      </tr></thead>
      <tbody id="ticketBody"><tr><td colspan="8" style="color:var(--text2)">加载中…</td></tr></tbody>
    </table>
  </div>

  <!-- 知识库 -->
  <div class="card hidden" id="tab-knowledge">
    <div class="two-col">
      <div>
        <h3 class="section">📚 新增知识文档 <small>自动切片并向量化入库</small></h3>
        <div class="field"><label>文档标题</label><input id="kbTitle" placeholder="如：会议室大屏无法投屏"></div>
        <div class="field"><label>文档内容（常见现象、处理步骤、注意事项）</label>
          <textarea id="kbContent" placeholder="现象：……&#10;处理步骤：1）…… 2）……&#10;注意：涉及硬件更换需提交工单"></textarea></div>
        <button class="btn" id="kbAddBtn">入库（切片 + 向量化）</button>
      </div>
      <div>
        <h3 class="section">已入库文档</h3>
        <div style="margin-bottom:14px">
          <button class="btn ghost" id="embedAllBtn">⚡ 向量补齐（种子数据导入后点一次）</button>
        </div>
        <table id="kbTable"><thead><tr><th>标题</th><th>切片</th><th>已向量化</th></tr></thead>
          <tbody id="kbBody"><tr><td colspan="3" style="color:var(--text2)">加载中…</td></tr></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let user = JSON.parse(localStorage.getItem('rag_user') || 'null');
let currentStatus = '';
const STATUS_TEXT = {OPEN:'待受理',PROCESSING:'处理中',RESOLVED:'已解决',CLOSED:'已关闭',CANCELLED:'已取消',DRAFT:'草稿'};
const STATUS_COLOR = {OPEN:'#f59e0b',PROCESSING:'#2563eb',RESOLVED:'#16a34a',CLOSED:'#64748b',CANCELLED:'#94a3b8',DRAFT:'#a855f7'};
const $ = id => document.getElementById(id);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
async function api(path, opts={}) {
  const resp = await fetch(API + path, {...opts, headers: {'Content-Type':'application/json','X-User-Id': user.id, ...(opts.headers||{})}});
  const data = await resp.json().catch(()=>({}));
  if (!resp.ok) throw new Error(data.message || '请求失败');
  return data;
}

const ADMINS = ['A0001', 'A0002'];
async function enterIdentity(empNo) {
  const resp = await fetch(API + '/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({empNo})
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.message || '切换身份失败');
  localStorage.setItem('rag_user', JSON.stringify(data));
  if (data.role !== 'ADMIN') { location.href = 'index.html'; return; }
  user = data;
  $('identitySelect').value = data.empNo;
  loadTickets(); loadKnowledge();
}
$('identitySelect').onchange = (e) => enterIdentity(e.target.value);

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('tab-tickets').classList.toggle('hidden', t.dataset.tab !== 'tickets');
  $('tab-knowledge').classList.toggle('hidden', t.dataset.tab !== 'knowledge');
});
document.querySelectorAll('#statusFilter button').forEach(b => b.onclick = () => {
  currentStatus = b.dataset.s;
  document.querySelectorAll('#statusFilter button').forEach(x => x.style.fontWeight = 'normal');
  b.style.fontWeight = '700';
  loadTickets();
});

/* ---------- 工单 ---------- */
async function loadTickets() {
  try {
    const tickets = await api('/api/admin/tickets' + (currentStatus ? '?status=' + currentStatus : ''));
    const body = $('ticketBody');
    body.innerHTML = '';
    if (!tickets.length) { body.innerHTML = '<tr><td colspan="8" style="color:var(--text2)">暂无工单</td></tr>'; return; }
    tickets.forEach(t => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="white-space:nowrap">${t.ticketNo || '（草稿）'}</td>
        <td>${esc(t.userName)}</td>
        <td>${esc(t.category)}</td>
        <td><b>${esc(t.title)}</b><br><span style="color:var(--text2);font-size:12px">${esc((t.description||'').slice(0,80))}</span>
          <br><button class="log-toggle" data-id="${t.id}">流水 ▾</button>
          <div class="log-panel hidden" id="log-${t.id}"></div></td>
        <td>${t.urgency}</td>
        <td><span class="badge" style="background:${STATUS_COLOR[t.status]||'#94a3b8'}">${STATUS_TEXT[t.status]||t.status}</span></td>
        <td>${esc(t.assignee || '-')}</td>
        <td>
          <select class="mini" data-f="status">
            ${['OPEN','PROCESSING','RESOLVED','CLOSED'].map(s =>
              `<option value="${s}" ${s===t.status?'selected':''}>${STATUS_TEXT[s]}</option>`).join('')}
          </select>
          <input class="mini" data-f="assignee" placeholder="处理人" value="${escAttr(t.assignee||'')}" style="width:70px;margin:4px 0">
          <input class="mini" data-f="note" placeholder="备注（推送给用户）" style="width:100%">
          <button class="btn" data-save="${t.id}" style="margin-top:6px;padding:5px 14px">保存</button>
        </td>`;
      body.appendChild(tr);
      tr.querySelector('.log-toggle').onclick = async () => {
        const panel = $('log-' + t.id);
        if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }
        const logs = await api(`/api/admin/tickets/${t.id}/logs`);
        panel.innerHTML = logs.map(l => `· [${fmtTime(l.createdAt)}] <b>${esc(l.action)}</b>（${esc(l.operator)}）${esc(l.detail||'')}`).join('<br>') || '暂无流水';
        panel.classList.remove('hidden');
      };
      tr.querySelector('[data-save]').onclick = async () => {
        try {
          await api(`/api/admin/tickets/${t.id}/status`, {
            method:'POST',
            body: JSON.stringify({
              status: tr.querySelector('[data-f="status"]').value,
              assignee: tr.querySelector('[data-f="assignee"]').value,
              note: tr.querySelector('[data-f="note"]').value
            })
          });
          toast('已更新，状态已实时推送到用户聊天窗口');
          loadTickets();
        } catch(e){ toast(e.message); }
      };
    });
  } catch(e){ $('ticketBody').innerHTML = `<tr><td colspan="8" style="color:#dc2626">${e.message}</td></tr>`; }
}

/* ---------- 知识库 ---------- */
async function loadKnowledge() {
  try {
    const docs = await api('/api/admin/knowledge');
    const body = $('kbBody');
    body.innerHTML = '';
    docs.forEach(d => {
      const tr = document.createElement('tr');
      const ok = d.chunks === d.embedded;
      tr.innerHTML = `<td>${esc(d.title)}</td><td>${d.chunks}</td>
        <td>${ok ? '✅ ' + d.embedded : '⚠️ ' + d.embedded + '/' + d.chunks + '（待补齐）'}</td>`;
      body.appendChild(tr);
    });
  } catch(e){ $('kbBody').innerHTML = `<tr><td colspan="3" style="color:#dc2626">${e.message}</td></tr>`; }
}
$('kbAddBtn').onclick = async () => {
  try {
    const r = await api('/api/admin/knowledge', {
      method:'POST',
      body: JSON.stringify({title: $('kbTitle').value, content: $('kbContent').value})
    });
    toast(`入库成功：切分为 ${r.chunks} 片并完成向量化`);
    $('kbTitle').value = ''; $('kbContent').value = '';
    loadKnowledge();
  } catch(e){ toast(e.message); }
};
$('embedAllBtn').onclick = async () => {
  try {
    const r = await api('/api/admin/knowledge/embed-all', {method:'POST'});
    toast(`已补齐 ${r.embedded} 条切片的向量`);
    loadKnowledge();
  } catch(e){ toast(e.message); }
};

/* ---------- utils ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function fmtTime(s){ return (s||'').replace('T',' ').slice(0,19); }

/* ---------- 启动 ---------- */
(async function init(){
  const empNo = user && ADMINS.includes(user.empNo) ? user.empNo : 'A0001';
  $('identitySelect').value = empNo;
  await enterIdentity(empNo);
})();
</script>
</body>
</html>
