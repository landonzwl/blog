<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小修 · IT 运维智能助手</title>
<style>
:root {
  --bg: #f4f6fa; --panel: #ffffff; --border: #e4e8f0;
  --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
  --text: #1e293b; --text2: #64748b;
  --ai-bg: #ffffff; --user-bg: #2563eb;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); overflow: hidden;
}
#app { display: flex; height: 100%; }

/* 侧栏 */
.sidebar {
  width: 260px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.logo {
  padding: 20px 18px 14px; font-weight: 700; font-size: 16px;
  display: flex; align-items: center; gap: 8px;
}
.logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.logo small { font-weight: 400; color: var(--text2); font-size: 12px; }
.new-session {
  margin: 4px 14px 12px; padding: 10px; border: 1px dashed var(--border); border-radius: 10px;
  background: none; color: var(--primary); font-size: 14px; cursor: pointer; transition: .15s;
}
.new-session:hover { background: var(--primary-light); border-color: var(--primary); }
.session-list { flex: 1; overflow-y: auto; padding: 0 10px; }
.session-item {
  padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 13px;
  color: var(--text2); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-item:hover { background: var(--bg); }
.session-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.sidebar-footer { border-top: 1px solid var(--border); padding: 14px; font-size: 13px; }
.user-chip { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--primary-light);
  color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
}
.user-meta b { display: block; font-size: 13px; }
.user-meta span { color: var(--text2); font-size: 12px; }
.footer-links { display: flex; gap: 10px; }
.footer-links a, .footer-links button {
  font-size: 12px; color: var(--text2); background: none; border: none; cursor: pointer; text-decoration: none;
}
.footer-links a:hover, .footer-links button:hover { color: var(--primary); }

/* 聊天主区 */
.chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-header {
  padding: 12px 26px; background: var(--panel); border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 15px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.chat-header small { display: block; font-weight: 400; color: var(--text2); font-size: 12px; margin-top: 2px; }
.identity { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text2); flex-shrink: 0; }
.identity select {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; color: var(--text); background: #fff; cursor: pointer;
}
.messages { flex: 1; overflow-y: auto; padding: 26px 26px 10px; }
.msg-row { display: flex; margin-bottom: 18px; gap: 10px; }
.msg-row.user { justify-content: flex-end; }
.bubble {
  max-width: 72%; padding: 12px 16px; border-radius: var(--radius); font-size: 14px;
  line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.msg-row.assistant .bubble { background: var(--ai-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg-row.user .bubble { background: var(--user-bg); color: #fff; border-bottom-right-radius: 4px; }
.bubble .cursor { display: inline-block; width: 8px; animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 系统提示条（工单状态） */
.sys-notice {
  max-width: 72%; margin: 0 auto 18px; padding: 10px 16px; border-radius: 10px;
  background: linear-gradient(90deg, #f0f9ff, #f0fdf4); border: 1px solid #bae6fd;
  font-size: 13px; color: #075985; display: flex; align-items: center; gap: 8px;
}
.sys-notice .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; color: #fff; flex-shrink: 0; }

/* 工具调用提示 */
.tool-notice {
  max-width: 72%; margin: 0 auto 12px; font-size: 12px; color: var(--text2);
  display: flex; align-items: center; gap: 6px; justify-content: center;
}
.tool-notice .spin {
  width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 工单确认卡片 */
.ticket-card {
  max-width: 560px; margin: 0 auto 20px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  box-shadow: 0 6px 20px rgba(30, 41, 59, .06);
}
.ticket-card .card-head {
  padding: 12px 18px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff;
  font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center;
}
.ticket-card .card-head span { font-weight: 400; font-size: 12px; opacity: .85; }
.ticket-card .card-body { padding: 16px 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: inherit; background: #fff; color: var(--text);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
}
.field textarea { min-height: 72px; resize: vertical; }
.card-actions { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  padding: 9px 22px; border-radius: 9px; border: none; font-size: 14px; cursor: pointer; transition: .15s;
}
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-dark); }
.btn.ghost { background: var(--bg); color: var(--text2); }
.btn.ghost:hover { background: var(--border); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.card-done {
  padding: 14px 18px; text-align: center; font-size: 14px; color: #16a34a; background: #f0fdf4;
}

/* 输入区 */
.composer {
  padding: 16px 26px 22px; background: linear-gradient(transparent, var(--bg) 30%);
}
.composer-box {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-end;
  box-shadow: 0 4px 16px rgba(30, 41, 59, .05);
}
.composer-box:focus-within { border-color: var(--primary); }
.composer textarea {
  flex: 1; border: none; resize: none; font-size: 14px; font-family: inherit;
  max-height: 130px; line-height: 1.6; color: var(--text); background: none;
}
.composer textarea:focus { outline: none; }
.send-btn {
  background: var(--primary); color: #fff; border: none; border-radius: 10px;
  padding: 10px 20px; font-size: 14px; cursor: pointer; flex-shrink: 0;
}
.send-btn:hover { background: var(--primary-dark); }
.send-btn:disabled { opacity: .45; cursor: not-allowed; }
.composer .tips { font-size: 11px; color: var(--text2); margin-top: 8px; text-align: center; }

/* 登录弹窗 */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .55); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  width: 380px; background: var(--panel); border-radius: 20px; padding: 30px;
  box-shadow: 0 20px 60px rgba(15, 23, 42, .3);
}
.modal h2 { font-size: 18px; margin-bottom: 6px; }
.modal p.sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
.modal .field input { width: 100%; }
.modal .btn { width: 100%; margin-top: 16px; padding: 11px; }
.demo-accounts { margin-top: 14px; font-size: 12px; color: var(--text2); text-align: center; line-height: 1.8; }
.demo-accounts b { color: var(--primary); cursor: pointer; }
.error-text { color: #dc2626; font-size: 12px; margin-top: 8px; min-height: 16px; }
.hidden { display: none !important; }

.empty-state { text-align: center; margin-top: 6vh; color: var(--text2); }
.empty-state .icon { font-size: 44px; margin-bottom: 12px; }
.empty-state h3 { color: var(--text); margin-bottom: 8px; }
.empty-state p { font-size: 13px; line-height: 2; }
.empty-state .eg { color: var(--primary); cursor: pointer; }
.topic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px auto 0; max-width: 460px; }
.topic-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
  font-size: 12.5px; color: var(--text); transition: all .15s; }
.topic-item:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(2,132,199,.12); }
.topic-icon { font-size: 22px; }
@media (max-width: 640px) { .topic-grid { grid-template-columns: repeat(2, 1fr); } }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><span class="dot"></span>小修 <small>IT 运维智能助手</small></div>
    <button class="new-session" id="newSessionBtn">＋ 新建会话</button>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer hidden" id="sidebarFooter">
      <div class="footer-links">
        <a href="admin.html" id="adminLink">管理后台</a>
      </div>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <div>
        <span id="chatTitle">新对话</span>
        <small>自然语言问答 · 知识库检索 · 自动工单生成 · 进度实时反馈</small>
      </div>
      <label class="identity">身份
        <select id="identitySelect">
          <option value="U1001">李雷 · 用户</option>
          <option value="U1002">韩梅梅 · 用户</option>
          <option value="A0001">张文龙 · 管理员</option>
          <option value="A0002">王工 · 管理员</option>
        </select>
      </label>
    </header>
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="icon">🛠️</div>
        <h3>你好，我是小修</h3>
        <p>打印机罢工、VPN 连不上、账号被锁……直接告诉我发生了什么<br>
        能解决的当场给你方案，需要人工的我帮你把工单都填好<br>
        试试：<span class="eg" onclick="quickAsk('打印机脱机了怎么办？')">打印机脱机了怎么办？</span> ·
        <span class="eg" onclick="quickAsk('办公室的网口连不上网，工位 3 楼 A12')">网口连不上网</span> ·
        <span class="eg" onclick="quickAsk('我上次报修的工单处理得怎么样了？')">查工单进度</span></p>
      </div>
    </div>
    <div class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="描述你的问题，例如：打印机脱机了怎么办？"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
      <div class="tips">内容由 AI 生成，请注意甄别；生成工单需本人确认后才会提交</div>
    </div>
  </main>
</div>

<script>
const API = '';
let user = null;
let sessionId = null;
let es = null;
let sending = false;
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const STATUS_TEXT = {OPEN:'待受理',PROCESSING:'处理中',RESOLVED:'已解决',CLOSED:'已关闭',CANCELLED:'已取消',DRAFT:'草稿'};
const STATUS_COLOR = {OPEN:'#f59e0b',PROCESSING:'#2563eb',RESOLVED:'#16a34a',CLOSED:'#64748b',CANCELLED:'#94a3b8',DRAFT:'#a855f7'};

const IDENTITIES = ['U1001', 'U1002', 'A0001', 'A0002'];
function loadUser(){ try { return JSON.parse(localStorage.getItem('rag_user')); } catch(e){ return null; } }
function saveUser(u){ localStorage.setItem('rag_user', JSON.stringify(u)); }

async function enterIdentity(empNo) {
  if (es) { es.close(); es = null; }
  sessionId = null;
  sending = false;
  const resp = await fetch(API + '/api/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({empNo})
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.message || '切换身份失败');
  user = data;
  saveUser(user);
  document.getElementById('identitySelect').value = user.empNo;
  document.getElementById('sidebarFooter').classList.toggle('hidden', user.role !== 'ADMIN');
  messagesEl.innerHTML = '';
  document.getElementById('chatTitle').textContent = '新对话';
  const sessions = await loadSessions();
  if (sessions && sessions.length) openSession(sessions[0].id, sessions[0].title);
  else showEmptyState();
}
document.getElementById('identitySelect').onchange = (e) => enterIdentity(e.target.value);

/* ---------- 会话管理 ---------- */
async function loadSessions() {
  const resp = await fetch(API + '/api/chat/sessions', {headers: {'X-User-Id': user.id}});
  if (!resp.ok) return [];
  const sessions = await resp.json();
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === sessionId ? ' active' : '');
    div.textContent = '💬 ' + s.title;
    div.title = s.title;
    div.onclick = () => openSession(s.id, s.title);
    list.appendChild(div);
  });
  return sessions;
}

async function createSession(title) {
  const resp = await fetch(API + '/api/chat/sessions', {
    method: 'POST', headers: {'Content-Type':'application/json','X-User-Id': user.id},
    body: JSON.stringify({title: title || ''})
  });
  const data = await resp.json();
  if (!resp.ok) { alert(data.message); return; }
  await loadSessions();
  await openSession(data.id, data.title, true);
}
document.getElementById('newSessionBtn').onclick = () => createSession();

async function openSession(id, title, skipHistory) {
  if (es) { es.close(); es = null; }
  sessionId = id;
  document.getElementById('chatTitle').textContent = title || '新对话';
  messagesEl.innerHTML = '';
  await loadSessions();
  if (!skipHistory) {
    await reloadSessionMessages(id);
  } else {
    showEmptyState();
  }
  connectSse(id);
}

/** 拉取会话全部历史并渲染（打开会话 / SSE 失联兜底共用） */
async function reloadSessionMessages(id) {
  const resp = await fetch(API + `/api/chat/sessions/${id}/messages`, {headers: {'X-User-Id': user.id}});
  if (!resp.ok) return;
  const history = await resp.json();
  messagesEl.innerHTML = '';
  if (history.length) {
    history.forEach(m => appendBubble(m.role, m.content));
  } else {
    showEmptyState();
  }
}

/** 常见问题分类：选择后自动发送开场消息进入对话 */
const QUICK_TOPICS = [
  { icon: '🖨️', label: '打印机问题', prompt: '打印机出了问题，需要帮忙排查一下' },
  { icon: '🌐', label: '网络 / VPN', prompt: '网络或 VPN 连接有问题，帮我看看怎么解决' },
  { icon: '💻', label: '电脑硬件', prompt: '电脑硬件出了故障（开不了机 / 蓝屏 / 异响等），需要报修' },
  { icon: '🔑', label: '账号 / 密码', prompt: '域账号或密码出了问题（被锁定 / 忘记密码 / 权限申请），需要帮助' },
  { icon: '📦', label: '软件安装', prompt: '需要安装软件或软件运行报错，需要帮助' },
  { icon: '📮', label: '邮箱问题', prompt: '邮箱出了问题（收不到邮件 / 空间已满等），需要帮助' },
  { icon: '🎫', label: '查工单进度', prompt: '帮我查一下我名下工单的处理进度' },
  { icon: '📝', label: '直接报修', prompt: '我要报修，问题是：' },
];

function showEmptyState() {
  if (document.getElementById('emptyState')) return;
  const div = document.createElement('div');
  div.className = 'empty-state';
  div.id = 'emptyState';
  div.innerHTML = `<div class="icon">🛠️</div>
    <h3>你好，我是小修</h3>
    <p>打印机罢工、VPN 连不上、账号被锁……直接告诉我发生了什么<br>
    能解决的当场给你方案，需要人工的我帮你把工单都填好</p>
    <div class="topic-grid" id="topicGrid"></div>`;
  messagesEl.appendChild(div);
  const grid = div.querySelector('#topicGrid');
  QUICK_TOPICS.forEach(t => {
    const item = document.createElement('div');
    item.className = 'topic-item';
    item.innerHTML = `<span class="topic-icon">${t.icon}</span><span>${t.label}</span>`;
    item.onclick = () => pickTopic(t);
    grid.appendChild(item);
  });
}

/** 选择分类 → 填入输入框（"直接报修"停在光标处，其余直接发送进入对话） */
async function pickTopic(t) {
  if (!sessionId) await createSession();
  if (t.prompt.endsWith('：')) {
    inputEl.value = t.prompt;
    inputEl.focus();
    autoGrow();
  } else {
    inputEl.value = t.prompt;
    autoGrow();
    await send();
  }
}

/* ---------- SSE ---------- */
function connectSse(id) {
  // EventSource 无法携带请求头，uid 通过 query 参数鉴权
  es = new EventSource(API + `/api/chat/stream/${id}?uid=${user.id}`);
  es.addEventListener('delta', e => {
    const data = JSON.parse(e.data);
    document.getElementById('emptyState') && document.getElementById('emptyState').remove();
    appendDelta(data.text);
  });
  es.addEventListener('tool', e => {
    const data = JSON.parse(e.data);
    showToolNotice(data.name);
  });
  es.addEventListener('ticket_draft', e => {
    const data = JSON.parse(e.data);
    renderTicketCard(data);
  });
  es.addEventListener('ticket', e => {
    const data = JSON.parse(e.data);
    renderTicketUpdate(data);
  });
  es.addEventListener('error', e => {
    if (e.data) {
      const data = JSON.parse(e.data);
      appendDelta('⚠️ ' + data.message, true);
      finishStreaming();
    }
  });
  es.addEventListener('done', finishStreaming);
}

/* ---------- 消息渲染 ---------- */
let streamingEl = null;
function appendBubble(role, content) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return bubble;
}
function removeThinking() {
  const t = document.getElementById('thinking'); t && t.remove();
}
function showThinking() {
  removeThinking();
  const div = document.createElement('div');
  div.className = 'tool-notice'; div.id = 'thinking';
  div.innerHTML = `<span class="spin"></span>小修正在思考（检索知识库、分析问题）…`;
  messagesEl.appendChild(div);
  scrollBottom();
}
function appendDelta(text, isError) {
  removeThinking();
  if (!streamingEl) {
    const notice = document.querySelector('.tool-notice'); notice && notice.remove();
    streamingEl = appendBubble('assistant', '');
    if (!isError) streamingEl.innerHTML = '<span class="cursor">▍</span>';
  }
  streamingEl.insertBefore(document.createTextNode(text), streamingEl.querySelector('.cursor'));
  scrollBottom();
}
function finishStreaming() {
  removeThinking();
  const notice = document.querySelector('.tool-notice'); notice && notice.remove();
  if (streamingEl) {
    const cursor = streamingEl.querySelector('.cursor'); cursor && cursor.remove();
    if (!streamingEl.textContent.trim()) {
      streamingEl.textContent = '（本次未生成内容）';
    }
    streamingEl = null;
  }
  sending = false;
  sendBtn.disabled = false;
}
function showToolNotice(toolName) {
  removeThinking();
  // 结束当前流式气泡但不解锁 sending（工具调用后还有下一轮生成，等 done 再解锁）
  if (streamingEl) {
    const cursor = streamingEl.querySelector('.cursor'); cursor && cursor.remove();
    if (!streamingEl.textContent.trim()) streamingEl.textContent = '（正在调用工具…）';
    streamingEl = null;
  }
  const names = {create_ticket:'正在生成工单草稿…', query_ticket:'正在查询工单…',
                 add_ticket_note:'正在补充工单信息…', submit_ticket_feedback:'正在提交反馈…'};
  const div = document.createElement('div');
  div.className = 'tool-notice';
  div.innerHTML = `<span class="spin"></span>${names[toolName] || '正在处理…'}`;
  messagesEl.appendChild(div);
  scrollBottom();
}
function renderTicketUpdate(data) {
  const div = document.createElement('div');
  div.className = 'sys-notice';
  const color = STATUS_COLOR[data.status] || '#0284c7';
  div.innerHTML = `<span class="badge" style="background:${color}">${STATUS_TEXT[data.status] || data.status}</span>
    <span>🎫 ${data.ticketNo ? data.ticketNo + ' · ' : ''}${data.message || ''}${data.assignee && data.status==='PROCESSING' ? '' : ''}</span>`;
  messagesEl.appendChild(div);
  scrollBottom();
}
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

/* ---------- 工单确认卡片 ---------- */
function renderTicketCard(d) {
  document.getElementById('emptyState') && document.getElementById('emptyState').remove();
  const card = document.createElement('div');
  card.className = 'ticket-card';
  card.innerHTML = `
    <div class="card-head">🎫 工单确认（AI 预填写）<span>请核对补充后提交</span></div>
    <div class="card-body">
      <div class="field"><label>问题类别</label>
        <select data-f="category">
          ${['网络','硬件','账号权限','软件','打印机','其他'].map(c =>
            `<option ${c===d.category?'selected':''}>${c}</option>`).join('')}
        </select></div>
      <div class="field"><label>标题</label><input data-f="title" value="${escAttr(d.title)}"></div>
      <div class="field"><label>故障描述（现象 / 时间 / 影响范围 / 已尝试操作）</label>
        <textarea data-f="description">${escHtml(d.description)}</textarea></div>
      <div class="field"><label>紧急程度</label>
        <select data-f="urgency">
          ${['紧急','高','普通','低'].map(u => `<option ${u===d.urgency?'selected':''}>${u}</option>`).join('')}
        </select></div>
      <div class="field"><label>设备信息（电脑编号 / IP / 会议室等，可留空）</label>
        <input data-f="deviceInfo" value="${escAttr(d.deviceInfo || '')}"></div>
      <div class="card-actions">
        <button class="btn primary" data-act="confirm">确认提交</button>
        <button class="btn ghost" data-act="cancel">取消</button>
      </div>
    </div>`;
  messagesEl.appendChild(card);
  scrollBottom();
  const collect = () => {
    const body = {};
    card.querySelectorAll('[data-f]').forEach(el => body[el.dataset.f] = el.value);
    return body;
  };
  card.querySelector('[data-act="confirm"]').onclick = async () => {
    const btn = card.querySelector('[data-act="confirm"]');
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const resp = await fetch(API + `/api/tickets/${d.draftId}/confirm`, {
        method: 'POST', headers: {'Content-Type':'application/json','X-User-Id': user.id},
        body: JSON.stringify(collect())
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.message);
      card.querySelector('.card-body').innerHTML =
        `<div class="card-done">✅ 工单已提交 · 单号 <b>${data.ticketNo}</b><br>处理进度会实时显示在聊天窗口</div>`;
    } catch (e) {
      btn.disabled = false; btn.textContent = '确认提交';
      alert('提交失败：' + e.message);
    }
  };
  card.querySelector('[data-act="cancel"]').onclick = async () => {
    await fetch(API + `/api/tickets/${d.draftId}/cancel`, {
      method: 'POST', headers: {'X-User-Id': user.id}});
    card.querySelector('.card-body').innerHTML = `<div class="card-done">已取消本次工单</div>`;
  };
}
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

/* ---------- 发送 ---------- */
async function send() {
  const content = inputEl.value.trim();
  if (!content || sending) return;
  // 未选中会话时自动新建一个，避免 /sessions/null/send
  if (!sessionId) await createSession();
  sending = true; sendBtn.disabled = true;
  inputEl.value = ''; autoGrow();
  document.getElementById('emptyState') && document.getElementById('emptyState').remove();
  appendBubble('user', content);
  try {
    const resp = await fetch(API + `/api/chat/sessions/${sessionId}/send`, {
      method: 'POST', headers: {'Content-Type':'application/json','X-User-Id': user.id},
      body: JSON.stringify({content})
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      appendBubble('assistant', '⚠️ ' + (data.message || '发送失败'));
      finishStreaming();
    } else {
      showThinking();
      // 兜底：若 60 秒内没收到任何 SSE 事件（连接断开等），拉取历史渲染，防止"无反应"
      setTimeout(async () => {
        if (!streamingEl && sending) {
          await reloadSessionMessages(sessionId);
          finishStreaming();
        }
      }, 60000);
    }
  } catch (e) {
    appendBubble('assistant', '⚠️ 网络异常：' + e.message);
    finishStreaming();
  }
}
sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
}
inputEl.addEventListener('input', autoGrow);
function quickAsk(q) { inputEl.value = q; send(); }

/* ---------- 启动 ---------- */
(async function init() {
  const saved = loadUser();
  const empNo = saved && IDENTITIES.includes(saved.empNo) ? saved.empNo : 'U1001';
  document.getElementById('identitySelect').value = empNo;
  await enterIdentity(empNo);
})();
</script>
