<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小修 · IT 运维智能助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #10221f;
  --muted: #5b726c;
  --line: #d5e4df;
  --panel: rgba(255, 255, 255, .88);
  --panel-solid: #ffffff;
  --bg0: #e8f4f0;
  --bg1: #f7faf8;
  --accent: #0f8f7b;
  --accent-deep: #0b6f60;
  --accent-soft: #d8f3ec;
  --user: #12352f;
  --danger: #c2410c;
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --header-h: 56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #c8ebe2 0%, transparent 55%),
    radial-gradient(900px 500px at 100% 0%, #dce9f5 0%, transparent 50%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
  overflow: hidden;
}
#app { display: flex; height: 100%; position: relative; }

.scrim {
  display: none;
  position: fixed; inset: 0; background: rgba(16, 34, 31, .42);
  backdrop-filter: blur(2px); z-index: 30;
}
.scrim.show { display: block; }

.sidebar {
  width: 288px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: rgba(255,255,255,.72);
  border-right: 1px solid var(--line);
  backdrop-filter: blur(14px);
  z-index: 40;
}
.brand {
  padding: 18px 18px 10px;
  display: flex; align-items: center; gap: 12px;
}
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px;
  background: linear-gradient(145deg, #14b8a6, #0f766e);
  color: #fff; display: grid; place-items: center;
  font-family: Sora, sans-serif; font-weight: 700; font-size: 15px;
  box-shadow: 0 8px 18px rgba(15, 143, 123, .28);
}
.brand-text b {
  display: block; font-family: Sora, "Noto Sans SC", sans-serif;
  font-size: 16px; letter-spacing: .02em;
}
.brand-text span { color: var(--muted); font-size: 12px; }
.sidebar-close {
  display: none; margin-left: auto; border: 0; background: transparent;
  color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px;
}
.new-session {
  margin: 6px 14px 12px; padding: 12px 14px; border-radius: 14px;
  border: 1px dashed #9fc9bf; background: rgba(255,255,255,.55);
  color: var(--accent-deep); font-size: 14px; font-weight: 600; cursor: pointer;
}
.new-session:active { transform: scale(.98); }
.session-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
.session-item {
  padding: 12px 12px; border-radius: 12px; cursor: pointer; font-size: 13px;
  color: var(--muted); margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-item.active, .session-item:hover {
  background: var(--accent-soft); color: var(--accent-deep); font-weight: 600;
}
.sidebar-footer {
  border-top: 1px solid var(--line); padding: 12px 16px 16px;
}
.sidebar-footer a {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--accent-deep); text-decoration: none; font-size: 13px; font-weight: 600;
}

.chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-header {
  min-height: var(--header-h);
  padding: 10px 14px;
  padding-top: calc(10px + var(--safe-t));
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.78);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel-solid); color: var(--ink); cursor: pointer;
  display: none; place-items: center; font-size: 18px; flex-shrink: 0;
}
.header-copy { min-width: 0; flex: 1; }
.header-copy #chatTitle {
  display: block; font-family: Sora, "Noto Sans SC", sans-serif;
  font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.header-copy small {
  display: block; color: var(--muted); font-size: 11px; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.identity {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted); flex-shrink: 0;
}
.identity select {
  max-width: 132px; padding: 8px 10px; border-radius: 12px;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  font-size: 12px; font-family: inherit; cursor: pointer;
}

.messages {
  flex: 1; overflow-y: auto; padding: 18px 16px 8px;
  -webkit-overflow-scrolling: touch;
}
.msg-row { display: flex; margin-bottom: 14px; }
.msg-row.user { justify-content: flex-end; }
.bubble {
  max-width: min(86%, 560px); padding: 12px 14px; border-radius: 18px;
  font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.msg-row.assistant .bubble {
  background: var(--panel-solid); border: 1px solid var(--line);
  border-bottom-left-radius: 6px;
  box-shadow: 0 8px 24px rgba(16, 34, 31, .04);
}
.msg-row.user .bubble {
  background: var(--user); color: #f4fffb;
  border-bottom-right-radius: 6px;
}
.bubble .cursor { display: inline-block; width: 8px; animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.sys-notice {
  max-width: min(92%, 560px); margin: 0 auto 14px; padding: 10px 12px;
  border-radius: 14px; background: #edf8f4; border: 1px solid #b7e0d4;
  font-size: 13px; color: #0b5c4f; display: flex; align-items: flex-start; gap: 8px;
}
.sys-notice .badge {
  font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; flex-shrink: 0;
}
.tool-notice {
  margin: 0 auto 12px; font-size: 12px; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tool-notice .spin {
  width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.ticket-card {
  max-width: min(100%, 560px); margin: 0 auto 16px;
  background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 18px; overflow: hidden;
  box-shadow: 0 12px 30px rgba(16, 34, 31, .06);
}
.ticket-card .card-head {
  padding: 12px 14px; background: linear-gradient(120deg, #0f766e, #0ea5a0);
  color: #fff; font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
}
.ticket-card .card-head span { font-weight: 400; font-size: 12px; opacity: .9; }
.ticket-card .card-body { padding: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px;
  font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
}
.field textarea { min-height: 88px; resize: vertical; }
.card-actions { display: flex; gap: 10px; margin-top: 8px; }
.btn {
  flex: 1; padding: 11px 16px; border-radius: 12px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn.primary { background: var(--accent); color: #fff; }
.btn.ghost { background: #eef4f2; color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.card-done { padding: 16px; text-align: center; font-size: 14px; color: #0f766e; background: #edf8f4; }

.composer {
  padding: 10px 12px calc(12px + var(--safe-b));
  background: linear-gradient(transparent, rgba(247,250,248,.92) 28%);
}
.composer-box {
  display: flex; gap: 10px; align-items: flex-end;
  padding: 10px 10px 10px 14px; border-radius: 20px;
  background: rgba(255,255,255,.92); border: 1px solid var(--line);
  box-shadow: 0 10px 28px rgba(16, 34, 31, .06);
}
.composer textarea {
  flex: 1; border: 0; resize: none; background: transparent;
  font: inherit; font-size: 15px; line-height: 1.5; max-height: 120px; color: var(--ink);
}
.composer textarea:focus { outline: none; }
.send-btn {
  width: 44px; height: 44px; border: 0; border-radius: 14px;
  background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0;
}
.send-btn:disabled { opacity: .45; cursor: not-allowed; }
.composer .tips {
  margin-top: 8px; text-align: center; font-size: 11px; color: var(--muted);
}

.empty-state {
  max-width: 520px; margin: 4vh auto 0; text-align: left; color: var(--muted);
  padding: 8px 4px 24px;
}
.empty-state .hero {
  display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px;
}
.empty-state .hero-badge {
  width: 52px; height: 52px; border-radius: 16px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 24px;
  background: linear-gradient(160deg, #14b8a6, #0f766e); color: #fff;
  box-shadow: 0 12px 24px rgba(15, 143, 123, .25);
}
.empty-state h3 {
  font-family: Sora, "Noto Sans SC", sans-serif;
  color: var(--ink); font-size: 22px; line-height: 1.25; margin-bottom: 6px;
}
.empty-state p { font-size: 13px; line-height: 1.7; }
.topic-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
}
.topic-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; border-radius: 16px; cursor: pointer;
  background: rgba(255,255,255,.86); border: 1px solid var(--line);
  font-size: 13px; color: var(--ink); font-weight: 500;
  transition: transform .15s ease, border-color .15s ease;
}
.topic-item:active { transform: scale(.98); }
.topic-item:hover { border-color: #8fc9bc; }
.topic-icon {
  width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center; background: var(--accent-soft); font-size: 18px;
}
.hidden { display: none !important; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: #b7cdc6; border-radius: 999px; }

@media (min-width: 900px) {
  .topic-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .messages { padding: 24px 28px 10px; }
  .composer { padding: 14px 28px 22px; }
  .chat-header { padding: 12px 22px; }
  .identity select { max-width: 180px; font-size: 13px; }
  .header-copy small { display: block; }
}

@media (max-width: 820px) {
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0;
    transform: translateX(-105%);
    transition: transform .22s ease;
    box-shadow: 18px 0 40px rgba(16, 34, 31, .12);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-close, .icon-btn { display: grid; }
  .header-copy small { display: none; }
  .identity span { display: none; }
  .bubble { max-width: 92%; }
  .empty-state { margin-top: 2vh; }
  .empty-state h3 { font-size: 20px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">修</div>
      <div class="brand-text">
        <b>小修</b>
        <span>IT 运维智能助手</span>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="关闭菜单">×</button>
    </div>
    <button class="new-session" id="newSessionBtn">＋ 新建会话</button>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer hidden" id="sidebarFooter">
      <a href="admin.html" id="adminLink">管理后台 →</a>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <button class="icon-btn" id="menuBtn" aria-label="打开会话列表">☰</button>
      <div class="header-copy">
        <span id="chatTitle">新对话</span>
        <small>问答 · 知识库 · 自动工单</small>
      </div>
      <label class="identity"><span>身份</span>
        <select id="identitySelect" aria-label="切换身份">
          <option value="U1001">李雷 · 用户</option>
          <option value="U1002">韩梅梅 · 用户</option>
          <option value="A0001">张文龙 · 管理员</option>
          <option value="A0002">王工 · 管理员</option>
        </select>
      </label>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="描述故障现象，例如：打印机脱机了"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="发送">↑</button>
      </div>
      <div class="tips">内容由 AI 生成；工单需确认后才会提交</div>
    </div>
  </main>
</div>

<script>
const API = '';
let user = null;
let sessionId = null;
let es = null;
let sending = false;
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
const STATUS_TEXT = {OPEN:'待受理',PROCESSING:'处理中',RESOLVED:'已解决',CLOSED:'已关闭',CANCELLED:'已取消',DRAFT:'草稿'};
const STATUS_COLOR = {OPEN:'#d97706',PROCESSING:'#0f8f7b',RESOLVED:'#15803d',CLOSED:'#64748b',CANCELLED:'#94a3b8',DRAFT:'#0ea5a0'};

function openDrawer() { sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeDrawer() { sidebar.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('menuBtn').onclick = openDrawer;
document.getElementById('sidebarClose').onclick = closeDrawer;
scrim.onclick = closeDrawer;

const IDENTITIES = ['U1001', 'U1002', 'A0001', 'A0002'];
function loadUser(){ try { return JSON.parse(localStorage.getItem('rag_user')); } catch(e){ return null; } }
function saveUser(u){ localStorage.setItem('rag_user', JSON.stringify(u)); }

async function enterIdentity(empNo) {
  if (es) { es.close(); es = null; }
  sessionId = null;
  sending = false;
  const resp = await fetch(API + '/api/auth/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({empNo})
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.message || '切换身份失败');
  user = data;
  saveUser(user);
  document.getElementById('identitySelect').value = user.empNo;
  document.getElementById('sidebarFooter').classList.toggle('hidden', user.role !== 'ADMIN');
  messagesEl.innerHTML = '';
  document.getElementById('chatTitle').textContent = '新对话';
  closeDrawer();
  const sessions = await loadSessions();
  if (sessions && sessions.length) openSession(sessions[0].id, sessions[0].title);
  else showEmptyState();
}
document.getElementById('identitySelect').onchange = (e) => enterIdentity(e.target.value);

async function loadSessions() {
  const resp = await fetch(API + '/api/chat/sessions', {headers: {'X-User-Id': user.id}});
  if (!resp.ok) return [];
  const sessions = await resp.json();
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === sessionId ? ' active' : '');
    div.textContent = s.title;
    div.title = s.title;
    div.onclick = () => { closeDrawer(); openSession(s.id, s.title); };
    list.appendChild(div);
  });
  return sessions;
}

async function createSession(title) {
  const resp = await fetch(API + '/api/chat/sessions', {
    method: 'POST', headers: {'Content-Type':'application/json','X-User-Id': user.id},
    body: JSON.stringify({title: title || ''})
  });
  const data = await resp.json();
  if (!resp.ok) { alert(data.message); return; }
  closeDrawer();
  await loadSessions();
  await openSession(data.id, data.title, true);
}
document.getElementById('newSessionBtn').onclick = () => createSession();

async function openSession(id, title, skipHistory) {
  if (es) { es.close(); es = null; }
  sessionId = id;
  document.getElementById('chatTitle').textContent = title || '新对话';
  messagesEl.innerHTML = '';
  await loadSessions();
  if (!skipHistory) await reloadSessionMessages(id);
  else showEmptyState();
  connectSse(id);
}

async function reloadSessionMessages(id) {
  const resp = await fetch(API + `/api/chat/sessions/${id}/messages`, {headers: {'X-User-Id': user.id}});
  if (!resp.ok) return;
  const history = await resp.json();
  messagesEl.innerHTML = '';
  if (history.length) history.forEach(m => appendBubble(m.role, m.content));
  else showEmptyState();
}

const QUICK_TOPICS = [
  { icon: '🖨️', label: '打印机问题', prompt: '打印机出了问题，需要帮忙排查一下' },
  { icon: '🌐', label: '网络 / VPN', prompt: '网络或 VPN 连接有问题，帮我看看怎么解决' },
  { icon: '💻', label: '电脑硬件', prompt: '电脑硬件出了故障（开不了机 / 蓝屏 / 异响等），需要报修' },
  { icon: '🔑', label: '账号 / 密码', prompt: '域账号或密码出了问题（被锁定 / 忘记密码 / 权限申请），需要帮助' },
  { icon: '📦', label: '软件安装', prompt: '需要安装软件或软件运行报错，需要帮助' },
  { icon: '📮', label: '邮箱问题', prompt: '邮箱出了问题（收不到邮件 / 空间已满等），需要帮助' },
  { icon: '🎫', label: '查工单进度', prompt: '帮我查一下我名下工单的处理进度' },
  { icon: '📝', label: '直接报修', prompt: '我要报修，问题是：' },
];

function showEmptyState() {
  if (document.getElementById('emptyState')) return;
  const div = document.createElement('div');
  div.className = 'empty-state';
  div.id = 'emptyState';
  div.innerHTML = `<div class="hero">
      <div class="hero-badge">修</div>
      <div>
        <h3>你好，我是小修</h3>
        <p>直接说故障现象。能自助的给你步骤，需要人工的我帮你填好工单。</p>
      </div>
    </div>
    <div class="topic-grid" id="topicGrid"></div>`;
  messagesEl.appendChild(div);
  const grid = div.querySelector('#topicGrid');
  QUICK_TOPICS.forEach(t => {
    const item = document.createElement('div');
    item.className = 'topic-item';
    item.innerHTML = `<span class="topic-icon">${t.icon}</span><span>${t.label}</span>`;
    item.onclick = () => pickTopic(t);
    grid.appendChild(item);
  });
}

async function pickTopic(t) {
  if (!sessionId) await createSession();
  if (t.prompt.endsWith('：')) {
    inputEl.value = t.prompt;
    inputEl.focus();
    autoGrow();
  } else {
    inputEl.value = t.prompt;
    autoGrow();
    await send();
  }
}

function connectSse(id) {
  es = new EventSource(API + `/api/chat/stream/${id}?uid=${user.id}`);
  es.addEventListener('delta', e => {
    const data = JSON.parse(e.data);
    document.getElementById('emptyState') && document.getElementById('emptyState').remove();
    appendDelta(data.text);
  });
  es.addEventListener('tool', e => {
    const data = JSON.parse(e.data);
    showToolNotice(data.name);
  });
  es.addEventListener('ticket_draft', e => renderTicketCard(JSON.parse(e.data)));
  es.addEventListener('ticket', e => renderTicketUpdate(JSON.parse(e.data)));
  es.addEventListener('error', e => {
    if (e.data) {
      const data = JSON.parse(e.data);
      appendDelta('⚠️ ' + data.message, true);
      finishStreaming();
    }
  });
  es.addEventListener('done', finishStreaming);
}

let streamingEl = null;
function appendBubble(role, content) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return bubble;
}
function removeThinking() {
  const t = document.getElementById('thinking'); t && t.remove();
}
function showThinking() {
  removeThinking();
  const div = document.createElement('div');
  div.className = 'tool-notice'; div.id = 'thinking';
  div.innerHTML = `<span class="spin"></span>小修正在检索知识库…`;
  messagesEl.appendChild(div);
  scrollBottom();
}
function appendDelta(text, isError) {
  removeThinking();
  if (!streamingEl) {
    const notice = document.querySelector('.tool-notice'); notice && notice.remove();
    streamingEl = appendBubble('assistant', '');
    if (!isError) streamingEl.innerHTML = '<span class="cursor">▍</span>';
  }
  streamingEl.insertBefore(document.createTextNode(text), streamingEl.querySelector('.cursor'));
  scrollBottom();
}
function finishStreaming() {
  removeThinking();
  const notice = document.querySelector('.tool-notice'); notice && notice.remove();
  if (streamingEl) {
    const cursor = streamingEl.querySelector('.cursor'); cursor && cursor.remove();
    if (!streamingEl.textContent.trim()) streamingEl.textContent = '（本次未生成内容）';
    streamingEl = null;
  }
  sending = false;
  sendBtn.disabled = false;
}
function showToolNotice(toolName) {
  removeThinking();
  if (streamingEl) {
    const cursor = streamingEl.querySelector('.cursor'); cursor && cursor.remove();
    if (!streamingEl.textContent.trim()) streamingEl.textContent = '（正在调用工具…）';
    streamingEl = null;
  }
  const names = {create_ticket:'正在生成工单草稿…', query_ticket:'正在查询工单…',
                 add_ticket_note:'正在补充工单信息…', submit_ticket_feedback:'正在提交反馈…'};
  const div = document.createElement('div');
  div.className = 'tool-notice';
  div.innerHTML = `<span class="spin"></span>${names[toolName] || '正在处理…'}`;
  messagesEl.appendChild(div);
  scrollBottom();
}
function renderTicketUpdate(data) {
  const div = document.createElement('div');
  div.className = 'sys-notice';
  const color = STATUS_COLOR[data.status] || '#0f8f7b';
  div.innerHTML = `<span class="badge" style="background:${color}">${STATUS_TEXT[data.status] || data.status}</span>
    <span>🎫 ${data.ticketNo ? data.ticketNo + ' · ' : ''}${data.message || ''}</span>`;
  messagesEl.appendChild(div);
  scrollBottom();
}
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function renderTicketCard(d) {
  document.getElementById('emptyState') && document.getElementById('emptyState').remove();
  const card = document.createElement('div');
  card.className = 'ticket-card';
  card.innerHTML = `
    <div class="card-head">工单确认<span>核对后提交</span></div>
    <div class="card-body">
      <div class="field"><label>问题类别</label>
        <select data-f="category">
          ${['网络','硬件','账号权限','软件','打印机','其他'].map(c =>
            `<option ${c===d.category?'selected':''}>${c}</option>`).join('')}
        </select></div>
      <div class="field"><label>标题</label><input data-f="title" value="${escAttr(d.title)}"></div>
      <div class="field"><label>故障描述</label>
        <textarea data-f="description">${escHtml(d.description)}</textarea></div>
      <div class="field"><label>紧急程度</label>
        <select data-f="urgency">
          ${['紧急','高','普通','低'].map(u => `<option ${u===d.urgency?'selected':''}>${u}</option>`).join('')}
        </select></div>
      <div class="field"><label>设备信息（可留空）</label>
        <input data-f="deviceInfo" value="${escAttr(d.deviceInfo || '')}"></div>
      <div class="card-actions">
        <button class="btn primary" data-act="confirm">确认提交</button>
        <button class="btn ghost" data-act="cancel">取消</button>
      </div>
    </div>`;
  messagesEl.appendChild(card);
  scrollBottom();
  const collect = () => {
    const body = {};
    card.querySelectorAll('[data-f]').forEach(el => body[el.dataset.f] = el.value);
    return body;
  };
  card.querySelector('[data-act="confirm"]').onclick = async () => {
    const btn = card.querySelector('[data-act="confirm"]');
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      const resp = await fetch(API + `/api/tickets/${d.draftId}/confirm`, {
        method: 'POST', headers: {'Content-Type':'application/json','X-User-Id': user.id},
        body: JSON.stringify(collect())
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.message);
      card.querySelector('.card-body').innerHTML =
        `<div class="card-done">工单已提交 · 单号 <b>${data.ticketNo}</b><br>进度会实时出现在对话里</div>`;
    } catch (e) {
      btn.disabled = false; btn.textContent = '确认提交';
      alert('提交失败：' + e.message);
    }
  };
  card.querySelector('[data-act="cancel"]').onclick = async () => {
    await fetch(API + `/api/tickets/${d.draftId}/cancel`, {
      method: 'POST', headers: {'X-User-Id': user.id}});
    card.querySelector('.card-body').innerHTML = `<div class="card-done">已取消本次工单</div>`;
  };
}
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

async function send() {
  const content = inputEl.value.trim();
  if (!content || sending) return;
  if (!sessionId) await createSession();
  sending = true; sendBtn.disabled = true;
  inputEl.value = ''; autoGrow();
  document.getElementById('emptyState') && document.getElementById('emptyState').remove();
  appendBubble('user', content);
  try {
    const resp = await fetch(API + `/api/chat/sessions/${sessionId}/send`, {
      method: 'POST', headers: {'Content-Type':'application/json','X-User-Id': user.id},
      body: JSON.stringify({content})
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      appendBubble('assistant', '⚠️ ' + (data.message || '发送失败'));
      finishStreaming();
    } else {
      showThinking();
      setTimeout(async () => {
        if (!streamingEl && sending) {
          await reloadSessionMessages(sessionId);
          finishStreaming();
        }
      }, 60000);
    }
  } catch (e) {
    appendBubble('assistant', '⚠️ 网络异常：' + e.message);
    finishStreaming();
  }
}
sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}
inputEl.addEventListener('input', autoGrow);
function quickAsk(q) { inputEl.value = q; send(); }

(async function init() {
  const saved = loadUser();
  const empNo = saved && IDENTITIES.includes(saved.empNo) ? saved.empNo : 'U1001';
  document.getElementById('identitySelect').value = empNo;
  await enterIdentity(empNo);
})();
</script>
